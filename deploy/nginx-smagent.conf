# Demo deployment: SPA served under https://<host>/smagent/ with the API
# proxied same-origin so no CORS configuration is needed on the backend.
#
# Install to /etc/nginx/sites-available/smagent.conf, adjust server_name and
# point `root` at the uploaded dist/, then enable + `nginx -t && reload`.
# TLS terminates here (e.g. via certbot --nginx, which fills in the ssl bits).

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;   # TODO: your domain

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/smagent;
    index index.html;

    # Backend (Spring Boot) — adjust host/port if it runs elsewhere.
    # Prefix /smagent is stripped so the backend keeps its /api/... routes.
    location /smagent/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Static assets are content-hashed — cache hard.
    location /smagent/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths under /smagent/ serve index.html.
    location /smagent/ {
        try_files $uri $uri/ /smagent/index.html;
    }
}

server {
    listen 80;
    server_name example.com;   # TODO: your domain
    return 301 https://$host$request_uri;
}
